<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .flex-container{
        display: flex;
        justify-content: space-between;    
        gap: 10px;
    }

    .flex-item{
        background-color: green;
        padding: 10px;
    }
    .fijo {
        flex: 0 0 auto;
    }
    .hijo1{
        flex: 1 0 0%;
    }
    .hijo2{
        flex: 2 0 0%;
    }

</style>
<body>
    
    <div class="flex-container">
        <div class="flex-item fijo">
            1
        </div>
        <div class="flex-item hijo1">
            2
        </div>
        <div class="flex-item hijo2">
            3
        </div>
    </div>
</body>
</html>
