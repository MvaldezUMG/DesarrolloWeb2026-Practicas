<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .table{
            width: 100%;
            border-collapse: collapse;
        }
        .table tbody tr td {
            padding: 12px 16px;
        }
        .table thead th {
            background: rgba(30,136,229,0.3);
            font-weight: 600;
        }
         .table thead tr th {
            padding: 12px 16px;
        }

        .table tbody tr:nth-child(even) { 
            background: aqua;
        }
        .table tbody tr:hover { 
            background: rgba(30,136,229,0.15);
        }


        @media (max-width: 400px) {
            table, thead, tbody, th, td, tr {
                display: block;
            }
            thead tr { display: none; }
            td {
                padding-left: 50%;
                position: relative;
            }
            td::before {
                content: attr(data-label);
                position: absolute; left: 10px;
                font-weight: bold;
            }
        }

    </style>
</head>
<body>
    <div style="overflow-x:">
        <table class="table">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Curso</th>
                    <th>Otro curso</th>
                    <th>Otro curso</th>
                    <th>Otro curso</th>
                    <th>Otro curso</th>
                    <th>Otro curso</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td data-label="Nombre">Juan</td>
                    <td data-label="Curso">Web</td>
                    <td>Web1</td>
                    <td>Web2</td>
                    <td>Web3</td>
                    <td>Web4</td>
                    
                </tr>
                <tr>
                    <td>Pedro</td>
                    <td>Web</td>
                    <td>Web1</td>
                    <td>Web2</td>
                    <td>Web3</td>
                    <td>Web4</td>
                    <td>Web5</td>
                    
                </tr>
                <tr>
                    <td>Jose</td>
                    <td>Mate</td>
                    <td>Web2</td>
                    <td>Web3</td>
                    <td>Web4</td>
                    <td>Web5</td>
                    <td>Web6</td>
                    
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
